name: mkl-pardiso-validate

# Phase 2: validate the license-clean oneMKL PARDISO adapter (inlaprog/src/pardiso-mkl.c)
# against dense LAPACK ground truth, driving it through the real GMRFLib PARDISO path.
# Builds libGMRFLib.a + the adapter + the validation driver; no inlaprog / no R needed.

on:
  workflow_dispatch:
  push:
    branches: [mkl-pardiso]

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-gsl
            mingw-w64-ucrt-x86_64-metis
            mingw-w64-ucrt-x86_64-muparser
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-suitesparse
            mingw-w64-ucrt-x86_64-libtool

      - name: Install Intel oneMKL (pip wheels)
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkl mkl-devel mkl-include

      - name: Locate MKL runtime dir
        run: |
          set -e
          PYPREFIX="$(cygpath -u "$(python -c 'import sys;print(sys.prefix)')")"
          MKL_DLL="$(find "$PYPREFIX" -iname 'mkl_rt*.dll' | head -1)"
          echo "MKL_DLLDIR=$(dirname "$MKL_DLL")" >> "$GITHUB_ENV"
          echo "found $MKL_DLL"

      - name: Build + install GMRFLib
        run: |
          set -e
          PREFIX="$PWD/local"
          mkdir -p "$PREFIX/lib" "$PREFIX/include" "$PREFIX/bin"
          # -DINLA_WITH_PARDISO is REQUIRED: it makes GMRFLib build the 1-based
          # ia1/ja1 CSR arrays the PARDISO path hands to pardiso() (NULL otherwise).
          make -C gmrflib \
            PREFIX="$PREFIX" LEXTPREFIX=/ucrt64 \
            CC=gcc CXX=g++ FC=gfortran \
            FLAGS="-O2 -fopenmp -pthread -DINLA_WITH_OPENBLAS -DINLA_WITH_PARDISO"
          make -C gmrflib PREFIX="$PREFIX" LEXTPREFIX=/ucrt64 install
          cp gmrflib/taucs/libtaucs.a "$PREFIX/lib/" 2>/dev/null || true
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Compile the oneMKL adapter
        run: |
          set -e
          gcc -O2 -fopenmp -DINLA_WITH_PARDISO_MKL \
              -c inlaprog/src/pardiso-mkl.c -o pardiso-mkl.o
          echo "adapter compiled"

      - name: Compile + link the validation driver
        run: |
          set -e
          gcc -O2 -fopenmp -I"$PREFIX/include" \
              -c gmrflib/pardiso-mkl-validate.c -o validate.o
          gcc -O2 -fopenmp -o validate.exe \
              validate.o pardiso-mkl.o \
              -L"$PREFIX/lib" -Wl,--start-group -lGMRFLib -ltaucs -Wl,--end-group \
              -lgsl -lmetis -lopenblas -lcrypto -lz -lstdc++ -lgfortran -lquadmath -lm
          echo "linked. mkl deps (none expected at link time):"
          ldd validate.exe | grep -i mkl || echo "  (none -- adapter loads mkl_rt at runtime)"

      - name: Run validation staged (SEQ baseline, TBB no-knob, TBB knob)
        run: |
          # tbb12.dll ships in the python prefix alongside mkl_rt (same dir as
          # MKL_DLLDIR); the MKL TBB threading layer (mkl_tbb_thread.3.dll) needs it.
          cp validate.exe "$MKL_DLLDIR/"
          cd "$MKL_DLLDIR"
          export PATH="$PATH:/ucrt64/bin"
          export MKL_INTERFACE_LAYER=LP64
          export MKL_VERBOSE=1
          run () {
            echo "==================== $1 ===================="
            ( shift; env "$@" ./validate.exe ) ; echo "[exit=$?]"
            echo
          }
          # 1) sequential baseline -- confirms my adapter change did not regress
          run "SEQUENTIAL (baseline)"        MKL_THREADING_LAYER=SEQUENTIAL
          # 2) TBB but NO MKL_NUM_THREADS -> adapter's mkl_set_num_threads block is
          #    skipped (nt=0). Isolates whether the TBB *layer* alone segfaults.
          run "TBB (no thread knob)"         MKL_THREADING_LAYER=TBB
          # 3) TBB + MKL_NUM_THREADS=4 -> full path (adapter pins thread count)
          run "TBB + MKL_NUM_THREADS=4"      MKL_THREADING_LAYER=TBB MKL_NUM_THREADS=4
